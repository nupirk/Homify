# /etc/nginx/sites-available/homify-api
# ln -s /etc/nginx/sites-available/homify-api /etc/nginx/sites-enabled/
# Replace api.example.com and the PHP-FPM socket path to match the VPS.

server {
    listen 80;
    listen [::]:80;

    server_name api.example.com;

    root /var/www/homify-api/public;
    index index.php;

    charset utf-8;

    # Partner KYC documents and avatars are uploaded through the API.
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/homify-api.access.log;
    error_log  /var/log/nginx/homify-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets + files served through the public/storage symlink.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Never serve dotfiles (.env, .git) or the PHPUnit cache.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }
}
